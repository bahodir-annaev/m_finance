<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ t('login') }} — MIZAN</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
     background:linear-gradient(140deg,#0b1220,#134e4a);
     font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.box{background:#fff;padding:34px 32px;border-radius:12px;width:min(370px,92vw);
     box-shadow:0 20px 50px rgba(0,0,0,.3)}
.logo{text-align:center;margin-bottom:22px}
.logo b{font-size:1.7rem;letter-spacing:.05em;color:#0f766e}
.logo div{color:#6b7280;font-size:.78rem;margin-top:2px}
label{display:block;font-size:.78rem;color:#6b7280;margin-bottom:4px;font-weight:500}
input{width:100%;padding:9px 11px;border:1px solid #cbd5e1;border-radius:6px;
      font:inherit;margin-bottom:14px}
input:focus{outline:2px solid #ccfbf1;border-color:#0f766e;outline-offset:-1px}
button{width:100%;padding:10px;background:#0f766e;color:#fff;border:none;border-radius:6px;
       font:inherit;font-weight:600;cursor:pointer}
button:hover{background:#115e59}
.err{background:#fee2e2;color:#991b1b;padding:9px 12px;border-radius:6px;
     margin-bottom:14px;font-size:.85rem}
.langs{text-align:center;margin-top:18px;display:flex;gap:8px;justify-content:center}
.langs a{color:#6b7280;font-size:.76rem;text-decoration:none;padding:3px 9px;
         border:1px solid #e3e8ef;border-radius:4px}
.langs a.on{background:#0f766e;color:#fff;border-color:#0f766e}
</style>
</head>
<body>
<form class="box" method="post">
  <div class="logo"><b>MIZAN</b><div>Finance v5.0</div></div>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <label>{{ t('username') }}</label>
  <input name="username" autofocus required autocomplete="username">
  <label>{{ t('password') }}</label>
  <input name="password" type="password" required autocomplete="current-password">
  <button type="submit">{{ t('login') }}</button>
  <div class="langs">
    <a href="/lang/uz" class="{% if lang=='uz' %}on{% endif %}">UZ</a>
    <a href="/lang/ru" class="{% if lang=='ru' %}on{% endif %}">RU</a>
    <a href="/lang/en" class="{% if lang=='en' %}on{% endif %}">EN</a>
  </div>
</form>
</body>
</html>
