<div id="msModalOverlay" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeMsModal()">
  <div class="modal-box">
    <div class="modal-header">
      <h3>{{ t('ms_edit_title') }}</h3>
      <button type="button" class="modal-close" onclick="closeMsModal()">&times;</button>
    </div>
    <form id="msEditForm" onsubmit="return saveMs(event)">
      <div class="modal-body">
        <input type="hidden" id="ms_id">
        <input type="hidden" id="ms_project_id" value="{{ proj.id }}">
        <div class="grid-2">
          <div class="field">
            <label>{{ t('ms_field_name') }} *</label>
            <input name="name" id="ms_name" required>
          </div>
          <div class="field">
            <label>{{ t('ms_field_code') }}</label>
            <input name="code" id="ms_code" style="font-family:monospace">
          </div>
          <div class="field">
            <label>{{ t('ms_field_work_type') }}</label>
            <select name="work_type" id="ms_work_type">
              <option value=""></option>
              {% for wt in work_types %}<option value="{{ wt.code }}">{{ wt.label_uz }}</option>{% endfor %}
            </select>
          </div>
          <div class="field">
            <label>{{ t('ms_field_status') }}</label>
            <select name="status" id="ms_status">
              <option value="planned">{{ t('ms_status_planned') }}</option>
              <option value="in_progress">{{ t('ms_status_in_progress') }}</option>
              <option value="done">{{ t('ms_status_done') }}</option>
              <option value="cancelled">{{ t('ms_status_cancelled') }}</option>
            </select>
          </div>
          <div class="field">
            <label>{{ t('ms_field_start') }}</label>
            <input type="date" name="start_date" id="ms_start_date">
          </div>
          <div class="field">
            <label>{{ t('ms_field_end') }}</label>
            <input type="date" name="end_date" id="ms_end_date">
          </div>
          <div class="field">
            <label>{{ t('ms_field_income') }}</label>
            <input type="number" step="any" min="0" name="planned_revenue" id="ms_planned_revenue">
          </div>
          <div class="field">
            <label>{{ t('ms_computed_cost') }}</label>
            <input type="text" id="ms_calc_cost" readonly tabindex="-1" style="background:var(--bg)">
          </div>
          <div class="field">
            <label>{{ t('ms_field_outsourcing') }}</label>
            <input type="number" step="any" min="0" name="planned_outsourcing" id="ms_planned_outsourcing">
          </div>
          <div class="field">
            <label>{{ t('ms_field_material') }}</label>
            <input type="number" step="any" min="0" name="planned_material" id="ms_planned_material">
          </div>
          <div class="field">
            <label>{{ t('ms_computed_hours') }}</label>
            <input type="text" id="ms_calc_hours" readonly tabindex="-1" style="background:var(--bg)">
          </div>
          <div class="field">
            <label>{{ t('ms_field_completion') }}</label>
            <input type="number" step="1" min="0" max="100" name="completion_percent" id="ms_completion">
          </div>
          <div class="field">
            <label>{{ t('ms_field_sort') }}</label>
            <input type="number" step="1" name="sort_order" id="ms_sort_order" value="100">
          </div>
        </div>
        <div style="margin:12px 0">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
            <label style="font-weight:600">{{ t('ms_staff_title') }}</label>
            <button type="button" class="btn btn-outline btn-sm" onclick="addStaffRow()">+ {{ t('ms_staff_add') }}</button>
          </div>
          <table style="font-size:12px">
            <thead><tr>
              <th>{{ t('ms_staff_employee') }}</th>
              <th>{{ t('ms_staff_hours') }}</th>
              <th class="num">{{ t('ms_computed_cost') }}</th>
              <th></th>
            </tr></thead>
            <tbody id="msStaffRows"></tbody>
          </table>
          <div id="msBillingHint" style="font-size:11px;color:var(--text-light);margin-top:4px"></div>
        </div>
        <div class="field">
          <label>{{ t('ms_field_notes') }}</label>
          <input name="notes" id="ms_notes">
        </div>
      </div>
      <div class="modal-footer" style="justify-content:space-between">
        <button type="button" class="btn btn-danger" id="msDeleteBtn" onclick="deleteMs()">{{ t('btn_delete') }}</button>
        <div style="display:flex;gap:8px">
          <button type="button" class="btn btn-outline" onclick="closeMsModal()">{{ t('btn_cancel') }}</button>
          <button type="submit" class="btn btn-primary">{{ t('acc_save') }}</button>
        </div>
      </div>
    </form>
  </div>
</div>

<script>
var MS_STAFF = [
{% for s in staff_rates %}  {id: {{ s.id }}, name: {{ s.name|tojson }}, cost: {{ s.cost_rate }}, bill: {{ s.billing_rate }}},
{% endfor %}];
var MS_RATES = {};
MS_STAFF.forEach(function (s) { MS_RATES[s.id] = s; });
var MS_BILLING_HINT = {{ t('ms_computed_billing')|tojson }};

function msFmt(n, dec) {
  return (n || 0).toLocaleString('ru-RU', {maximumFractionDigits: dec || 0});
}

function staffOptions(selected) {
  var html = '<option value=""></option>';
  MS_STAFF.forEach(function (s) {
    html += '<option value="' + s.id + '"' + (s.id == selected ? ' selected' : '') + '>' + s.name + '</option>';
  });
  return html;
}

function addStaffRow(staffId, hours) {
  var tr = document.createElement('tr');
  tr.innerHTML =
    '<td><select name="ms_staff_id" onchange="recalcMs()" style="width:100%">' + staffOptions(staffId || '') + '</select></td>' +
    '<td><input type="number" name="ms_staff_hours" value="' + (hours || 0) + '" min="0" step="0.5" style="width:90px" oninput="recalcMs()"></td>' +
    '<td class="num ms-row-cost" style="white-space:nowrap"></td>' +
    '<td><button type="button" class="btn btn-outline btn-sm" onclick="this.closest(\'tr\').remove();recalcMs()">&times;</button></td>';
  document.getElementById('msStaffRows').appendChild(tr);
  recalcMs();
}

function recalcMs() {
  var rows = document.querySelectorAll('#msStaffRows tr');
  var th = 0, tc = 0, tb = 0;
  rows.forEach(function (tr) {
    var sid = tr.querySelector('[name=ms_staff_id]').value;
    var h = parseFloat(tr.querySelector('[name=ms_staff_hours]').value) || 0;
    var r = MS_RATES[sid] || {cost: 0, bill: 0};
    th += h; tc += h * r.cost; tb += h * r.bill;
    tr.querySelector('.ms-row-cost').textContent = msFmt(h * r.cost);
  });
  // No rows → keep the stored plan figures shown by openMsModal (legacy /
  // pricing-generated milestones have scalars but no employee rows).
  if (!rows.length) {
    document.getElementById('msBillingHint').textContent = '';
    return;
  }
  document.getElementById('ms_calc_hours').value = msFmt(th, 1);
  document.getElementById('ms_calc_cost').value = msFmt(tc);
  document.getElementById('msBillingHint').textContent = MS_BILLING_HINT.replace('{0}', msFmt(tb));
  var rev = document.getElementById('ms_planned_revenue');
  if (!parseFloat(rev.value)) rev.value = Math.round(tb);
}

function openMsModalNew() {
  document.getElementById('ms_id').value = '';
  ['ms_name', 'ms_code', 'ms_start_date', 'ms_end_date', 'ms_notes'].forEach(function (id) {
    document.getElementById(id).value = '';
  });
  ['ms_planned_revenue', 'ms_planned_outsourcing',
   'ms_planned_material', 'ms_completion'].forEach(function (id) {
    document.getElementById(id).value = 0;
  });
  document.getElementById('ms_calc_hours').value = 0;
  document.getElementById('ms_calc_cost').value = 0;
  document.getElementById('msStaffRows').innerHTML = '';
  document.getElementById('msBillingHint').textContent = '';
  document.getElementById('ms_sort_order').value = 100;
  document.getElementById('ms_work_type').value = '';
  document.getElementById('ms_status').value = 'planned';
  document.getElementById('msDeleteBtn').style.display = 'none';
  document.getElementById('msModalOverlay').style.display = 'flex';
}

function openMsModal(row) {
  var d = row.dataset;
  document.getElementById('ms_id').value = d.id;
  document.getElementById('ms_name').value = d.name || '';
  document.getElementById('ms_code').value = d.code || '';
  document.getElementById('ms_work_type').value = d.workType || '';
  document.getElementById('ms_status').value = d.status || 'planned';
  document.getElementById('ms_start_date').value = d.start || '';
  document.getElementById('ms_end_date').value = d.end || '';
  document.getElementById('ms_planned_revenue').value = d.plannedRevenue || 0;
  document.getElementById('ms_planned_outsourcing').value = d.plannedOutsourcing || 0;
  document.getElementById('ms_planned_material').value = d.plannedMaterial || 0;
  document.getElementById('ms_calc_hours').value = msFmt(parseFloat(d.plannedHours) || 0, 1);
  document.getElementById('ms_calc_cost').value = msFmt(parseFloat(d.plannedCost) || 0);
  document.getElementById('ms_completion').value = d.completion || 0;
  document.getElementById('ms_sort_order').value = d.sortOrder || 100;
  document.getElementById('ms_notes').value = d.notes || '';
  document.getElementById('msStaffRows').innerHTML = '';
  document.getElementById('msBillingHint').textContent = '';
  var staff = [];
  try { staff = JSON.parse(d.staff || '[]'); } catch (e) {}
  staff.forEach(function (s) { addStaffRow(s.staff_id, s.est_hours); });
  recalcMs();
  document.getElementById('msDeleteBtn').style.display = '';
  document.getElementById('msModalOverlay').style.display = 'flex';
}

function closeMsModal() {
  document.getElementById('msModalOverlay').style.display = 'none';
}

function saveMs(e) {
  e.preventDefault();
  var id = document.getElementById('ms_id').value;
  var fd = new FormData(document.getElementById('msEditForm'));
  var url;
  if (id) {
    url = '/api/milestones/' + id + '/update';
  } else {
    url = '/api/milestones/add';
    fd.append('project_id', document.getElementById('ms_project_id').value);
  }
  fetch(url, { method: 'POST', body: fd })
    .then(function (r) { return r.json(); })
    .then(function (res) {
      if (res.status === 'ok') { location.reload(); }
      else { alert(res.error || 'Error'); }
    })
    .catch(function () { alert('Error'); });
  return false;
}

function deleteMs() {
  if (!confirm({{ t('ms_del_confirm')|tojson }})) return;
  var id = document.getElementById('ms_id').value;
  fetch('/api/milestones/' + id + '/delete', { method: 'POST' })
    .then(function (r) { return r.json(); })
    .then(function (res) {
      if (res.status === 'ok') { location.reload(); }
      else if (res.error === 'blocked') {
        alert({{ t('ms_del_blocked')|tojson }}.replace('{0}', res.used));
      } else { alert(res.error || 'Error'); }
    })
    .catch(function () { alert('Error'); });
}

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') closeMsModal();
});
</script>
