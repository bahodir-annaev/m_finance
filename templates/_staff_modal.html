<div id="stModalOverlay" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeStModal()">
  <div class="modal-box">
    <div class="modal-header">
      <h3>{{ t('st_edit_title') }}</h3>
      <button type="button" class="modal-close" onclick="closeStModal()">&times;</button>
    </div>
    <form id="stEditForm" onsubmit="return saveSt(event)">
      <div class="modal-body">
        <input type="hidden" id="st_id">
        <div class="grid-2">
          <div class="field">
            <label>{{ t('st_field_name') }} *</label>
            <input name="name" id="st_name" required>
          </div>
          <div class="field">
            <label>{{ t('st_field_full_name') }}</label>
            <input name="full_name" id="st_full_name">
          </div>
          <div class="field">
            <label>{{ t('st_field_role') }}</label>
            <input name="role" id="st_role" list="st_role_options" autocomplete="off">
            <datalist id="st_role_options">
              {% for r in staff_roles %}<option value="{{ r.label_uz }}"></option>{% endfor %}
            </datalist>
          </div>
          <div class="field">
            <label>{{ t('st_field_department') }}</label>
            <input name="department" id="st_department" list="st_dept_options" autocomplete="off">
            <datalist id="st_dept_options">
              {% for d in departments %}<option value="{{ d.label_uz }}"></option>{% endfor %}
            </datalist>
          </div>
          <div class="field">
            <label>{{ t('st_field_type') }}</label>
            <select name="staff_type" id="st_staff_type">
              <option value="production">{{ t('staff_production') }}</option>
              <option value="admin">{{ t('staff_admin') }}</option>
            </select>
          </div>
          <div class="field">
            <label>{{ t('st_field_status') }}</label>
            <select name="is_active" id="st_is_active">
              <option value="1">{{ t('st_status_active') }}</option>
              <option value="0">{{ t('st_status_inactive') }}</option>
            </select>
          </div>
        </div>
      </div>
      <div class="modal-footer" style="justify-content:flex-end">
        <button type="button" class="btn btn-outline" onclick="closeStModal()">{{ t('btn_cancel') }}</button>
        <button type="submit" class="btn btn-primary">{{ t('acc_save') }}</button>
      </div>
    </form>
  </div>
</div>

<script>
function openStModal(row) {
  var d = row.dataset;
  document.getElementById('st_id').value = d.id;
  document.getElementById('st_name').value = d.name || '';
  document.getElementById('st_full_name').value = d.fullName || '';
  document.getElementById('st_role').value = d.role || '';
  document.getElementById('st_department').value = d.department || '';
  document.getElementById('st_staff_type').value = d.staffType || 'production';
  document.getElementById('st_is_active').value = d.isActive || '1';
  document.getElementById('stModalOverlay').style.display = 'flex';
}

function closeStModal() {
  document.getElementById('stModalOverlay').style.display = 'none';
}

function saveSt(e) {
  e.preventDefault();
  var id = document.getElementById('st_id').value;
  var fd = new FormData(document.getElementById('stEditForm'));
  fetch('/api/update/staff/' + id, { method: 'POST', body: fd })
    .then(function (r) { return r.json(); })
    .then(function (res) {
      if (res.status === 'ok') { location.reload(); }
      else { alert(res.error || 'Error'); }
    })
    .catch(function () { alert('Error'); });
  return false;
}

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') closeStModal();
});
</script>
