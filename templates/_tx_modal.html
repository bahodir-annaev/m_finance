<div id="txModalOverlay" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeTxModal()">
  <div class="modal-box">
    <div class="modal-header">
      <h3>{{ t('tx_edit_title') }}</h3>
      <button type="button" class="modal-close" onclick="closeTxModal()">&times;</button>
    </div>
    <form id="txEditForm" onsubmit="return saveTx(event)">
      <div class="modal-body">
        <input type="hidden" id="tx_id">
        <div class="grid-2">
          <div class="field">
            <label>{{ t('acc_direction') }}</label>
            <select name="direction" id="tx_direction" onchange="onDirChange()">
              <option value="external">{{ t('tx_dir_external') }}</option>
              <option value="internal">{{ t('tx_dir_internal') }}</option>
            </select>
          </div>
          <div class="field">
            <label>{{ t('th_date') }}</label>
            <input type="date" name="date" id="tx_date">
          </div>
          <div class="field">
            <label>{{ t('th_type') }}</label>
            <select name="tx_type" id="tx_type"></select>
          </div>
          <div class="field">
            <label>{{ t('acc_currency') }}</label>
            <select name="currency" id="tx_currency">
              <option value="UZS">UZS</option>
              <option value="USD">USD</option>
            </select>
          </div>
          <div class="field">
            <label>{{ t('th_amount') }}</label>
            <input type="number" step="any" name="amount" id="tx_amount">
          </div>
          <div class="field">
            <label>{{ t('th_paid') }}</label>
            <input type="number" step="any" name="paid" id="tx_paid">
          </div>
          <div class="field tx-ext-only">
            <label>{{ t('th_project') }}</label>
            <select name="project_id" id="tx_project" onchange="buildPhaseOptions(this.value, '')">
              <option value="">{{ t('acc_select') }}</option>
              {% for p in m_projects %}<option value="{{ p.id }}">{{ p.name }}</option>{% endfor %}
            </select>
          </div>
          <div class="field tx-ext-only">
            <label>{{ t('tx_phase_label') }}</label>
            <select name="phase_id" id="tx_phase">
              <option value=""></option>
            </select>
          </div>
          <div class="field tx-ext-only">
            <label>{{ t('tx_client') }}</label>
            <input name="client" id="tx_client">
          </div>
          <div class="field">
            <label>{{ t('acc_paid_to') }}</label>
            <input name="paid_to" id="tx_paid_to">
          </div>
          <div class="field">
            <label>{{ t('acc_responsible') }}</label>
            <input name="responsible" id="tx_responsible">
          </div>
          <div class="field">
            <label>{{ t('tx_payment_type') }}</label>
            <select name="payment_type" id="tx_payment_type">
              {% for pt in m_payment_types %}<option value="{{ pt.code }}">{{ pt.label_uz }}</option>{% endfor %}
            </select>
          </div>
          <div class="field">
            <label>{{ t('tx_doc_id') }}</label>
            <input name="doc_id" id="tx_doc_id">
          </div>
          <div class="field tx-ext-only">
            <label>{{ t('th_status') }}</label>
            <!-- derived from amount vs paid on save; not editable directly -->
            <input id="tx_status" disabled>
          </div>
          <div class="field tx-ext-only">
            <label>{{ t('tx_deadline') }}</label>
            <input type="date" name="deadline" id="tx_deadline">
          </div>
        </div>
        <div class="field">
          <label>{{ t('th_description') }}</label>
          <input name="description" id="tx_description">
        </div>
        <div class="field">
          <label>{{ t('th_notes') }}</label>
          <input name="notes" id="tx_notes">
        </div>
        <div id="tx_unresolved_note" class="alert alert-warn" style="display:none;margin-bottom:0">
          {{ t('tx_unresolved_note') }}
        </div>
      </div>
      <div class="modal-footer" style="justify-content:space-between">
        <button type="button" class="btn btn-danger" onclick="deleteTx()">{{ t('btn_delete') }}</button>
        <div style="display:flex;gap:8px">
          <button type="button" class="btn btn-outline" onclick="closeTxModal()">{{ t('btn_cancel') }}</button>
          <button type="submit" class="btn btn-primary">{{ t('acc_save') }}</button>
        </div>
      </div>
    </form>
  </div>
</div>

<script>
var TX_TYPES = [
{% for tt in m_tx_types %}  {code: {{ tt.code|tojson }}, label: {{ (tt.label_uz or tt.code)|tojson }}, dir: {{ tt.direction|tojson }}},
{% endfor %}];
var PHASES = [
{% for ph in (m_phases or []) %}  {id: {{ ph.id|tojson }}, projectId: {{ ph.project_id|tojson }}, name: {{ ph.name|tojson }}},
{% endfor %}];
var PHASE_NONE = {{ t('acc_select')|tojson }};
var STATUS_LABELS = {
  paid: {{ t('status_paid')|tojson }},
  pending: {{ t('status_pending')|tojson }},
  partial: {{ t('status_partial')|tojson }}
};

function buildPhaseOptions(projectId, current) {
  var sel = document.getElementById('tx_phase');
  sel.innerHTML = '';
  var none = document.createElement('option');
  none.value = ''; none.textContent = PHASE_NONE;
  sel.appendChild(none);
  PHASES.forEach(function (ph) {
    if (String(ph.projectId) === String(projectId)) {
      var o = document.createElement('option');
      o.value = ph.id; o.textContent = ph.name;
      sel.appendChild(o);
    }
  });
  setSelectValue('tx_phase', current || '');
}

function setSelectValue(id, val) {
  var sel = document.getElementById(id);
  val = (val == null) ? '' : String(val);
  var has = Array.prototype.some.call(sel.options, function (o) { return o.value === val; });
  if (!has && val !== '') {
    var o = document.createElement('option');
    o.value = val; o.textContent = val;
    sel.appendChild(o);
  }
  sel.value = val;
}

function buildTxTypeOptions(dir, current) {
  var sel = document.getElementById('tx_type');
  sel.innerHTML = '';
  TX_TYPES.forEach(function (tt) {
    if (tt.dir === dir || tt.dir === 'both') {
      var o = document.createElement('option');
      o.value = tt.code; o.textContent = tt.label;
      sel.appendChild(o);
    }
  });
  setSelectValue('tx_type', current || '');
}

function applyDirectionVisibility(dir) {
  document.querySelectorAll('#txEditForm .tx-ext-only').forEach(function (el) {
    el.style.display = (dir === 'external') ? '' : 'none';
  });
}

function onDirChange() {
  var dir = document.getElementById('tx_direction').value;
  buildTxTypeOptions(dir, document.getElementById('tx_type').value);
  applyDirectionVisibility(dir);
}

function openTxModal(row) {
  var d = row.dataset;
  var dir = d.direction || 'external';
  document.getElementById('tx_id').value = d.id;
  document.getElementById('tx_direction').value = dir;
  document.getElementById('tx_date').value = d.date || '';
  document.getElementById('tx_amount').value = d.amount || '';
  document.getElementById('tx_paid').value = d.paid || '';
  setSelectValue('tx_currency', d.currency || 'UZS');
  setSelectValue('tx_project', d.projectId || '');
  document.getElementById('tx_client').value = d.client || '';
  document.getElementById('tx_paid_to').value = d.paidTo || '';
  document.getElementById('tx_responsible').value = d.responsibleName || '';
  setSelectValue('tx_payment_type', d.paymentType || '');
  document.getElementById('tx_doc_id').value = d.docId || '';
  document.getElementById('tx_status').value = STATUS_LABELS[d.status] || d.status || '';
  document.getElementById('tx_deadline').value = d.deadline || '';
  document.getElementById('tx_description').value = d.description || '';
  document.getElementById('tx_notes').value = d.notes || '';
  buildPhaseOptions(d.projectId || '', d.phaseId || '');
  buildTxTypeOptions(dir, d.txType || '');
  applyDirectionVisibility(dir);
  document.getElementById('tx_unresolved_note').style.display = (d.unresolved === '1') ? '' : 'none';
  document.getElementById('txModalOverlay').style.display = 'flex';
}

function closeTxModal() {
  document.getElementById('txModalOverlay').style.display = 'none';
}

function saveTx(e) {
  e.preventDefault();
  var id = document.getElementById('tx_id').value;
  var fd = new FormData(document.getElementById('txEditForm'));
  fetch('/api/update/transactions/' + id, { method: 'POST', body: fd })
    .then(function (r) { return r.json(); })
    .then(function (res) {
      if (res.status === 'ok') { location.reload(); }
      else { alert(res.error || 'Error'); }
    })
    .catch(function () { alert('Error'); });
  return false;
}

function deleteTx() {
  if (!confirm({{ t('tx_del_confirm')|tojson }})) return;
  var id = document.getElementById('tx_id').value;
  fetch('/api/delete/transactions/' + id, { method: 'POST' })
    .then(function (r) { return r.json(); })
    .then(function (res) {
      if (res.status === 'ok') { location.reload(); }
      else { alert(res.error || 'Error'); }
    })
    .catch(function () { alert('Error'); });
}

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') closeTxModal();
});
</script>
