{% extends "base.html" %}
{% block content %}
<h1 class="page-title">{{ t('imp_title') }}</h1>
<p class="page-subtitle">{{ t('imp_subtitle') }}</p>

<div class="card" style="border-left:4px solid var(--accent)">
  <h3>Eski Excel hisobotni import qilish</h3>
  <p style="font-size:13px;color:var(--text-light);margin-bottom:16px">
    Istalgan Excel faylni yuklang — tizim ustunlarni avtomatik aniqlaydi va mos jadvalga import qiladi.
  </p>
  <form method="POST" enctype="multipart/form-data" action="/api/import-excel/analyze">
    <div class="grid-2">
      <div class="field"><label>Excel fayl (.xlsx)</label>
        <input type="file" name="file" accept=".xlsx,.xls" required></div>
      <div class="field"><label>Maqsad jadval</label>
        <select name="target">
          <option value="auto">Avtomatik aniqlash</option>
          <option value="external_transactions">01-Tashqi aylanma</option>
          <option value="internal_transactions">02-Ichki aylanma</option>
          <option value="mixed_transactions">03-Mix (Pul beruvchi / Приход / Расход)</option>
        </select></div>
    </div>
    <button type="submit" class="btn btn-accent" style="margin-top:8px">Tahlil qilish va import</button>
  </form>
</div>
{% endblock %}
